name: Publish immutable artifact

on:
  push:
    branches: [dev]
  workflow_dispatch:
    inputs:
      source_commit:
        description: Optional full 40-character SHA override; defaults to this workflow's commit
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: artifact-${{ inputs.source_commit || github.sha }}
  cancel-in-progress: false

env:
  PYTHONUTF8: '1'
  RUST_STABLE: '1.97.0'
  NDK_VERSION: r27d
  NDK_SHA256: 601246087a682d1944e1e16dd85bc6e49560fe8b6d61255be2829178c8ed15d9

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_commit || github.sha }}
          persist-credentials: false
      - name: Validate requested commit is the checked-out source
        env:
          SOURCE_COMMIT: ${{ inputs.source_commit || github.sha }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_COMMIT" =~ ^[0-9a-f]{40}$ ]] || { echo 'expected full lowercase 40-character source SHA' >&2; exit 2; }
          actual=$(git rev-parse HEAD)
          [ "$actual" = "$SOURCE_COMMIT" ] || { echo "checked out $actual, expected $SOURCE_COMMIT" >&2; exit 1; }
      - name: Rust toolchain
        run: |
          rustup toolchain install "$RUST_STABLE" --profile minimal -c rustfmt,clippy -t aarch64-linux-android
          rustup default "$RUST_STABLE"
      - name: Rust tests and lint
        run: |
          cargo fmt --all --check
          cargo clippy --locked --workspace --all-targets -- -D warnings
          cargo test --locked --workspace
      - name: Validate source commit and install Android NDK (checksum verified)
        id: source
        env:
          SOURCE_COMMIT: ${{ inputs.source_commit || github.sha }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_COMMIT" =~ ^[0-9a-f]{40}$ ]] || { echo "source_commit must be a full SHA-1" >&2; exit 2; }
          actual=$(git rev-parse HEAD)
          [ "$actual" = "$SOURCE_COMMIT" ] || { echo "checked out $actual, expected $SOURCE_COMMIT" >&2; exit 1; }
          echo "sha=$actual" >> "$GITHUB_OUTPUT"
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 2 -o /tmp/ndk.zip "https://dl.google.com/android/repository/android-ndk-${NDK_VERSION}-linux.zip"
          echo "${NDK_SHA256}  /tmp/ndk.zip" | sha256sum -c -
          unzip -q /tmp/ndk.zip -d /tmp
          rm /tmp/ndk.zip
          echo "ANDROID_NDK_HOME=/tmp/android-ndk-${NDK_VERSION}" >> "$GITHUB_ENV"
      - name: Build Android artifact
        run: scripts/build-android.sh
      - name: Package artifact and integrity manifest
        id: pack
        env:
          SOURCE_COMMIT: ${{ inputs.source_commit || github.sha }}
        run: |
          set -euo pipefail
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)
          mkdir -p "$RUNNER_TEMP/artifact-stage"
          python3 .github/scripts/package_artifact.py \
            --source-dir "dist/zairenkai-fas" \
            --component "zairenkai-fas" \
            --repository "$GITHUB_REPOSITORY" \
            --source-commit "$SOURCE_COMMIT" \
            --version "$version" \
            --output-dir "$RUNNER_TEMP/artifact-stage"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: immutable-release-assets
          path: ${{ runner.temp }}/artifact-stage/*
          if-no-files-found: error
          retention-days: 7

  draft-release:
    needs: [build]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: immutable-release-assets
          path: release-assets
      - name: Create draft release for exact source commit
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_COMMIT: ${{ inputs.source_commit || github.sha }}
          COMPONENT: zairenkai-fas
        run: |
          set -euo pipefail
          [[ "$SOURCE_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          tag="artifact-$SOURCE_COMMIT"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $tag already exists; do not replace an immutable artifact." >&2
            exit 1
          fi
          (cd release-assets && sha256sum -c artifact-manifest.sha256)
          archive=$(find release-assets -maxdepth 1 -type f -name '*.tar.gz' -print -quit)
          test -n "$archive"
          gh release create "$tag" --repo "$GITHUB_REPOSITORY" --draft --target "$SOURCE_COMMIT" \
            --title "$COMPONENT artifact $SOURCE_COMMIT" \
            --notes "Built and tested at immutable source commit $SOURCE_COMMIT. Verify artifact-manifest.json and SHA-256 before publishing. This draft must be reviewed before it becomes consumable." \
            "$archive" release-assets/artifact-manifest.json release-assets/artifact-manifest.sha256
          echo "Created draft release $tag. A maintainer must review and publish it before consumers will pin it." >> "$GITHUB_STEP_SUMMARY"
