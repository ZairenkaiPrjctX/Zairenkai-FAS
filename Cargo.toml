[workspace]
resolver = "2"
members = ["crates/zfas-core", "crates/zfas-platform", "crates/zfasd"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
publish = false

[workspace.dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
toml = "1.1.8"
libc = "0.2.191"

[profile.release]
lto = true
codegen-units = 1
panic = "unwind"
strip = "symbols"
